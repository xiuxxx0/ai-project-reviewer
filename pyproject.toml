[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repocourse"
version = "0.1.1"
description = "RepoCourse: AI-era project learning review assistant — review reports, knowledge graph, skill assessment and learning plans (zero dependencies)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "xiuxxx0"}]
keywords = ["ai", "llm", "deepseek", "code-review", "learning", "knowledge-graph", "cli", "obsidian"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/xiuxxx0/ai-project-reviewer"
Repository = "https://github.com/xiuxxx0/ai-project-reviewer"

[project.scripts]
apr = "apr.cli:main"

[tool.setuptools]
packages = ["apr", "apr.llm", "apr.evidence", "apr.assessment", "apr.prompts",
            "apr.knowledge", "apr.events", "apr.coach"]
