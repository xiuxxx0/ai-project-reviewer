[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-reviewer"
version = "0.1.0"
description = "AI 项目复盘助手：扫描代码项目，基于多源证据 + LLM 分析，生成 README复盘.md"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
apr = "apr.cli:main"

[tool.setuptools]
packages = ["apr", "apr.llm", "apr.evidence", "apr.assessment", "apr.prompts",
            "apr.knowledge", "apr.events"]
